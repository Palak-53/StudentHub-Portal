        <a href="home.html" class="brand">
            <span class="brand-icon">S</span>
            <span class="brand-text">Student Hub</span>
        </a>
        <div class="header-nav">
            <a href="home.html">Home</a>
            <a href="aboutus.html">About Us</a>

            <a href="profile.html" class="nav-profile-box" title="View Profile">
                <span class="nav-profile-avatar">👤</span>
                <span class="nav-profile-name">Palak K.</span>
            </a>
            <button class="theme-toggle" id="themeToggle" title="Toggle theme">🌙</button>
        </div>
    </header>

    <main class="app-container">

        <div class="breadcrumb">
            <a href="home.html">Home</a> / <span>Contact</span>
        </div>

        <h1 class="page-title">Contact Us</h1>

        <div class="card" style="max-width: 680px; margin: 0 auto 30px auto; padding: 28px;">
            <h2 style="color: var(--primary); margin-bottom: 20px;">Send Us a Message (PHP POST Form)</h2>

            <form action="process.php" method="POST" id="contactHtmlForm">
                <input type="hidden" name="form_type" value="Contact Form">

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="fullName" class="form-label" style="font-weight: 600;">Full Name <span style="color:red;">*</span></label>
                        <input type="text" id="fullName" name="fullName" class="form-control" placeholder="e.g. Palak Kansagara" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="email" class="form-label" style="font-weight: 600;">Email Address <span style="color:red;">*</span></label>
                        <input type="email" id="email" name="email" class="form-control" placeholder="student@college.edu" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="mobile" class="form-label" style="font-weight: 600;">Mobile Number <span style="color:red;">*</span></label>
                        <input type="tel" id="mobile" name="mobile" class="form-control" placeholder="10-digit mobile" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="category" class="form-label" style="font-weight: 600;">Category <span style="color:red;">*</span></label>
                        <select id="category" name="category" class="form-select" required>
                            <option value="">Select Category</option>
                            <option value="General Query">General Query</option>
                            <option value="Admissions">Admissions</option>
                            <option value="Attendance & Leave">Attendance & Leave</option>
                            <option value="Fees & Accounts">Fees & Accounts</option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="subject" class="form-label" style="font-weight: 600;">Subject <span style="color:red;">*</span></label>
                    <input type="text" id="subject" name="subject" class="form-control" placeholder="Subject of your inquiry" required>
                </div>

                <div class="mb-3">
                    <label for="message" class="form-label" style="font-weight: 600;">Message <span style="color:red;">*</span></label>
                    <textarea id="message" name="message" rows="4" class="form-control" placeholder="Write your message here..." required></textarea>
                </div>

                <div class="form-check mb-4">
                    <input type="checkbox" id="terms" name="terms" class="form-check-input" required>
                    <label for="terms" class="form-check-label" style="font-size: 13px;">I agree to the portal privacy policy and terms. <span style="color:red;">*</span></label>
                </div>

                <button type="submit" class="btn-primary w-100 py-2">✉️ Submit Inquiry (POST to process.php)</button>
            </form>
        </div>

    </main>

    <footer class="app-footer">
